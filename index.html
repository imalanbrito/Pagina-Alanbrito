<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alan · @imalanbrito</title>
<meta name="description" content="Streams, clips, código y cosas impresas en 3D. Todas las redes de @imalanbrito en un solo lugar.">
<meta property="og:title" content="@imalanbrito">
<meta property="og:description" content="Streams, clips, código y cosas impresas en 3D.">
<meta property="og:image" content="https://github.com/imalanbrito.png">
<meta name="theme-color" content="#D5D9CF">
<link rel="icon" href="https://github.com/imalanbrito.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">

<style>
  :root {
    --board: #D5D9CF;
    --board-shade: #BEC3B7;
    --hole: #9EA497;
    --ink: #1F2427;
    --ink-soft: #4A5257;
    --peg: #2B3033;
    --plate: #F4F5F0;

    --display: "Unbounded", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;

    --grid: 28px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font: 400 1rem/1.5 var(--body);
    background-color: var(--board);
    /* agujeros del pegboard */
    background-image:
      radial-gradient(circle at 50% 50%, var(--hole) 0 3.5px, rgba(158,164,151,.35) 4.5px, transparent 5px),
      linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.04));
    background-size: var(--grid) var(--grid), 100% 100%;
  }

  main {
    width: min(100% - 2.5rem, 46rem);
    margin: 0 auto;
    padding: 3rem 0 2rem;
  }

  /* ---------- Placa con tu nombre ---------- */
  .plate {
    position: relative;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 1.25rem;
    align-items: center;
    max-width: 34rem;
    padding: 1.4rem 1.6rem 1.4rem 1.4rem;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,.035) 0 1px, transparent 1px 3px),
      var(--plate);
    border-radius: 14px;
    box-shadow:
      0 2px 0 rgba(255,255,255,.7) inset,
      0 -3px 0 rgba(0,0,0,.08) inset,
      0 14px 22px -12px rgba(31,36,39,.45);
  }
  /* tornillos */
  .plate::before, .plate::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 9px; height: 9px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #8d948f, #3c4244);
    box-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  .plate::before { left: -4.5px; }
  .plate::after  { right: -4.5px; }

  .avatar, .monogram {
    width: 84px; height: 84px;
    border-radius: 20px;
    object-fit: cover;
    background: var(--board-shade);
    box-shadow: 0 0 0 3px var(--plate), 0 0 0 5px var(--ink);
  }

  .monogram {
    display: grid;
    place-items: center;
    font: 800 2.4rem/1 var(--display);
    color: var(--plate);
    background: #7446D8;
  }
  .name {
    margin: 0;
    font: 800 clamp(2rem, 7vw, 3rem)/0.95 var(--display);
    letter-spacing: -0.02em;
    /* relieve, como letra extruida sobre la placa */
    text-shadow: 0 1px 0 #fff, 0 3px 0 rgba(31,36,39,.18);
  }
  .handle {
    margin: .45rem 0 0;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .bio {
    max-width: 34rem;
    text-shadow: 0 0 4px var(--board), 0 0 4px var(--board), 0 0 8px var(--board);
    margin: 1.5rem 0 0;
    font-size: 1.125rem;
    line-height: 1.5;
  }

  /* ---------- Etiquetas colgantes ---------- */
  .wall {
    list-style: none;
    margin: 3rem 0 0;
    padding: 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 2.75rem 1.75rem;
  }
  @media (min-width: 680px) {
    .wall { grid-template-columns: 1fr 1fr; }
  }

  .slot { position: relative; padding-top: 14px; }

  /* gancho */
  .slot::before {
    content: "";
    position: absolute;
    top: 14px; left: 50%;
    width: 16px; height: 16px;
    margin-top: 0;
    margin-left: -8px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #5b6266, var(--peg) 60%);
    box-shadow: 0 0 0 2px rgba(255,255,255,.4), 0 3px 4px rgba(0,0,0,.3);
    z-index: 2;
  }

  .tag {
    --fil: #888;
    --tag-ink: #fff;
    --tilt: 0deg;
    position: relative;
    display: block;
    padding: 2.1rem 1.4rem 1.3rem;
    color: var(--tag-ink);
    text-decoration: none;
    border-radius: 16px 16px 18px 18px;
    background:
      /* líneas de capa de impresión 3D */
      repeating-linear-gradient(180deg, rgba(0,0,0,.07) 0 1px, rgba(255,255,255,.05) 1px 2px, transparent 2px 3.2px),
      linear-gradient(160deg, rgba(255,255,255,.16), rgba(0,0,0,.08)),
      var(--fil);
    /* el orificio por donde cuelga */
    -webkit-mask: radial-gradient(circle 7px at 50% 8px, transparent 98%, #000 100%);
            mask: radial-gradient(circle 7px at 50% 8px, transparent 98%, #000 100%);
    transform-origin: 50% 8px;
    transform: rotate(var(--tilt));
    filter: drop-shadow(0 12px 10px rgba(31,36,39,.28));
    outline: none;
  }
  /* las máscaras recortan el outline, así que el foco va en el contenedor */
  .slot:has(.tag:focus-visible) {
    outline: 3px solid var(--ink);
    outline-offset: 8px;
    border-radius: 20px;
  }

  .tag-title {
    display: block;
    font: 800 1.35rem/1.1 var(--display);
    letter-spacing: -0.01em;
  }
  .tag-sub {
    display: block;
    margin-top: .4rem;
    font-size: 1rem;
    line-height: 1.4;
    opacity: .92;
  }

  /* variantes de filamento */
  .t-twitch    { --fil: #7446D8; }
  .t-youtube   { --fil: #CF3626; }
  .t-tiktok    { --fil: #22B8B0; --tag-ink: var(--ink); }
  .t-instagram { --fil: #F08A24; --tag-ink: var(--ink); }
  .t-linkedin  { --fil: #F7F7F2; --tag-ink: var(--ink); }
  .t-github {
    --fil: #2A3035;
    background:
      radial-gradient(1.2px 1.2px at 18% 30%, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 72% 22%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.4px 1.4px at 84% 70%, rgba(190,215,255,.8), transparent),
      radial-gradient(1px 1px at 40% 78%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.1px 1.1px at 58% 52%, rgba(220,200,255,.7), transparent),
      radial-gradient(1px 1px at 9% 82%, rgba(255,255,255,.6), transparent),
      repeating-linear-gradient(180deg, rgba(0,0,0,.12) 0 1px, rgba(255,255,255,.04) 1px 2px, transparent 2px 3.2px),
      var(--fil);
  }

  /* en vivo */
  .live {
    display: none;
    align-items: center;
    gap: .45rem;
    margin-top: .75rem;
    padding: .2rem .65rem .2rem .5rem;
    width: fit-content;
    font-weight: 700;
    font-size: .95rem;
    color: var(--ink);
    background: #fff;
    border-radius: 999px;
  }
  .live::before {
    content: "";
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #E8262B;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .is-live .live { display: inline-flex; }

  /* ---------- En lo que ando (cinta de rotuladora) ---------- */
  .now {
    margin: 4rem 0 0;
  }
  .now h2, footer p {
    text-shadow: 0 0 4px var(--board), 0 0 4px var(--board), 0 0 8px var(--board);
  }
  .now h2 {
    margin: 0 0 1rem;
    font: 500 1.05rem/1.2 var(--display);
  }
  .tapes {
    display: flex;
    flex-wrap: wrap;
    gap: .7rem .6rem;
    margin: 0; padding: 0;
    list-style: none;
  }
  .tapes li {
    padding: .35rem .8rem;
    font-weight: 700;
    color: #F4F5F0;
    background: var(--ink);
    border-radius: 3px;
    clip-path: polygon(0 0, 100% 0, 98.5% 50%, 100% 100%, 0 100%, 1.5% 50%);
  }
  .tapes li:nth-child(3n+2) { transform: rotate(-1.2deg); }
  .tapes li:nth-child(3n)   { transform: rotate(.8deg); }

  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-top: 4rem;
    padding-top: 1.25rem;
    border-top: 2px dashed var(--hole);
    color: var(--ink-soft);
    font-size: .95rem;
  }
  footer p { margin: 0; }
  .lang {
    font: 700 .95rem var(--body);
    color: var(--ink);
    background: var(--plate);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: .35rem .9rem;
    cursor: pointer;
  }
  .lang:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* ---------- Movimiento ---------- */
  @keyframes hang {
    0%   { transform: translateY(-46px) rotate(calc(var(--tilt) - 9deg)); opacity: 0; }
    45%  { transform: translateY(0) rotate(calc(var(--tilt) + 5deg)); opacity: 1; }
    70%  { transform: rotate(calc(var(--tilt) - 2.5deg)); }
    88%  { transform: rotate(calc(var(--tilt) + 1deg)); }
    100% { transform: rotate(var(--tilt)); }
  }
  @keyframes swing {
    0%   { transform: rotate(var(--tilt)); }
    25%  { transform: rotate(calc(var(--tilt) + 5deg)); }
    50%  { transform: rotate(calc(var(--tilt) - 3.5deg)); }
    75%  { transform: rotate(calc(var(--tilt) + 1.5deg)); }
    100% { transform: rotate(var(--tilt)); }
  }
  @keyframes pulse { 50% { opacity: .35; } }

  .tag.drop  { animation: hang 900ms cubic-bezier(.3,.7,.4,1) both; animation-delay: var(--delay, 0ms); }
  .tag.swing { animation: swing 700ms ease-out; }

  @media (prefers-reduced-motion: reduce) {
    .tag.drop, .tag.swing { animation: none; }
    .live::before { animation: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="plate">
      <img class="avatar" id="avatar" alt="" width="84" height="84">
      <div>
        <h1 class="name" id="name"></h1>
        <p class="handle" id="handle"></p>
      </div>
    </div>
    <p class="bio" id="bio"></p>
  </header>

  <ul class="wall" id="wall"></ul>

  <section class="now" aria-labelledby="now-title">
    <h2 id="now-title"></h2>
    <ul class="tapes" id="tapes"></ul>
  </section>

  <footer>
    <p id="footnote"></p>
    <button class="lang" id="lang" type="button"></button>
  </footer>
</main>

<script>
/* ==========================================================
   CONFIGURACIÓN: aquí editas todo, no hace falta tocar nada más
   ========================================================== */
const CONFIG = {
  name: "Alan",
  handle: "@imalanbrito",
  avatar: "https://github.com/imalanbrito.png?size=200",
  twitchUser: "imalanbritoo",       // para detectar si estás en vivo
  defaultLang: "es",

  // style: twitch | youtube | tiktok | instagram | github | linkedin
  // Pon enabled:false para esconder una etiqueta sin borrarla.
  links: [
    { id: "twitch", style: "twitch", url: "https://twitch.tv/imalanbritoo", enabled: true,
      es: { title: "Twitch", sub: "Juego, platico y a veces programo en vivo. Horario fijo: algún día." },
      en: { title: "Twitch", sub: "Gaming, chatting and sometimes coding live. Fixed schedule: someday." } },
    { id: "youtube", style: "youtube", url: "https://youtube.com/@imalanbrito", enabled: true,
      es: { title: "YouTube", sub: "Lo mejor de cada stream, editado con cariño y muy poca dignidad." },
      en: { title: "YouTube", sub: "The best of every stream, edited with love and very little dignity." } },
    { id: "tiktok", style: "tiktok", url: "https://www.tiktok.com/@imalanbrito", enabled: true, // TODO: confirmar usuario
      es: { title: "TikTok", sub: "Clips cortos de cosas que no debieron pasar en vivo." },
      en: { title: "TikTok", sub: "Short clips of things that shouldn't have happened on stream." } },
    { id: "instagram", style: "instagram", url: "https://www.instagram.com/imalanbrito", enabled: true, // TODO: confirmar usuario
      es: { title: "Instagram", sub: "Reels, impresiones 3D y lo que pasa detrás de cámara." },
      en: { title: "Instagram", sub: "Reels, 3D prints and what happens off camera." } },
    { id: "github", style: "github", url: "https://github.com/imalanbrito", enabled: true,
      es: { title: "GitHub", sub: "Visión por computadora, streamcut y otros proyectos que compilan (casi siempre)." },
      en: { title: "GitHub", sub: "Computer vision, streamcut and other projects that compile (mostly)." } },
    { id: "linkedin", style: "linkedin", url: "https://www.linkedin.com/in/TU-USUARIO", enabled: true, // TODO: poner tu URL
      es: { title: "LinkedIn", sub: "La versión seria. Hola, reclutadores." },
      en: { title: "LinkedIn", sub: "The serious version. Hi, recruiters." } },
  ],

  text: {
    es: {
      bio: "Hago streams, los convierto en clips, entreno modelos de IA y lleno mi pared de cosas impresas en 3D. Escoge una etiqueta.",
      live: "En vivo ahora, pásale",
      nowTitle: "En lo que ando",
      now: ["Construyendo streamcut", "Entrenando YOLO con larvas", "Imprimiendo soportes para mi openGrid", "Armando algo con una Raspberry Pi 5"],
      footnote: "Hecho a mano y colgado en GitHub Pages.",
      switchTo: "English",
    },
    en: {
      bio: "I stream, turn streams into clips, train AI models and cover my wall in 3D-printed stuff. Pick a tag.",
      live: "Live right now, come hang",
      nowTitle: "What I'm up to",
      now: ["Building streamcut", "Training YOLO on larvae", "Printing mounts for my openGrid", "Wiring something up with a Raspberry Pi 5"],
      footnote: "Handmade and hung on GitHub Pages.",
      switchTo: "Español",
    },
  },
};

/* ==========================================================
   Lógica
   ========================================================== */
const $ = (id) => document.getElementById(id);
const tilts = ["-1.6deg", "1.2deg", "0.6deg", "-0.9deg", "1.8deg", "-0.4deg"];
let lang = (() => {
  try { return localStorage.getItem("lang") || CONFIG.defaultLang; } catch { return CONFIG.defaultLang; }
})();
let isLive = false;
let firstRender = true;

function track(id) {
  // Conteo de clics: si agregas GoatCounter (ver README), esto empieza a registrar.
  if (window.goatcounter && window.goatcounter.count) {
    window.goatcounter.count({ path: "click/" + id, title: id, event: true });
  }
}

function render() {
  const t = CONFIG.text[lang];
  document.documentElement.lang = lang;
  $("name").textContent = CONFIG.name;
  $("handle").textContent = CONFIG.handle;
  $("avatar").src = CONFIG.avatar;
  $("bio").textContent = t.bio;
  $("now-title").textContent = t.nowTitle;
  $("footnote").textContent = t.footnote;
  $("lang").textContent = t.switchTo;

  $("tapes").replaceChildren(...t.now.map((item) => {
    const li = document.createElement("li");
    li.textContent = item;
    return li;
  }));

  const wall = $("wall");
  wall.replaceChildren(...CONFIG.links.filter((l) => l.enabled).map((link, i) => {
    const copy = link[lang];
    const li = document.createElement("li");
    li.className = "slot";

    const a = document.createElement("a");
    a.className = "tag t-" + link.style + (link.style === "twitch" && isLive ? " is-live" : "");
    a.href = link.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.style.setProperty("--tilt", tilts[i % tilts.length]);
    a.style.setProperty("--delay", (150 + i * 90) + "ms");
    if (firstRender) a.classList.add("drop");

    const title = document.createElement("span");
    title.className = "tag-title";
    title.textContent = copy.title;
    const sub = document.createElement("span");
    sub.className = "tag-sub";
    sub.textContent = copy.sub;
    a.append(title, sub);

    if (link.style === "twitch") {
      const live = document.createElement("span");
      live.className = "live";
      live.textContent = t.live;
      a.append(live);
    }

    const swing = () => {
      if (a.classList.contains("drop")) return;
      a.classList.remove("swing");
      void a.offsetWidth; // reinicia la animación
      a.classList.add("swing");
    };
    a.addEventListener("pointerenter", swing);
    a.addEventListener("focus", swing);
    a.addEventListener("animationend", () => a.classList.remove("drop", "swing"));
    a.addEventListener("click", () => track(link.id));

    li.append(a);
    return li;
  }));
  firstRender = false;
}

$("lang").addEventListener("click", () => {
  lang = lang === "es" ? "en" : "es";
  try { localStorage.setItem("lang", lang); } catch {}
  render();
});

// Si la foto no carga, ponemos tu inicial en su lugar
$("avatar").addEventListener("error", (e) => {
  const m = document.createElement("div");
  m.className = "monogram";
  m.setAttribute("aria-hidden", "true");
  m.textContent = CONFIG.name.charAt(0);
  e.target.replaceWith(m);
}, { once: true });

// ¿Estás en vivo? DecAPI devuelve el tiempo al aire, o "... is offline".
async function checkLive() {
  try {
    const res = await fetch("https://decapi.me/twitch/uptime/" + CONFIG.twitchUser, { cache: "no-store" });
    const text = (await res.text()).toLowerCase();
    const live = res.ok && !text.includes("offline") && !text.includes("error") && !text.includes("not found");
    if (live !== isLive) {
      isLive = live;
      document.querySelectorAll(".t-twitch").forEach((el) => el.classList.toggle("is-live", isLive));
    }
  } catch { /* sin conexión al servicio: la etiqueta se queda normal */ }
}

render();
checkLive();
setInterval(checkLive, 120000);
</script>
</body>
</html>
